server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /app { return 302 /app/; }
    location = /admin { return 302 /admin/; }
    location = /status { return 302 /status/; }

    location /v1/api/ {
        proxy_pass http://voicelink-preview-backend:8980/v1/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v2/ {
        proxy_pass http://voicelink-preview-backend:8980/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v2/adminapi/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://voicelink-preview-backend:8980/v2/adminapi/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /status-probe/ {
        proxy_pass http://vrcls-preview-status:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location ^~ /admin/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        try_files $uri $uri/ /admin/index.html;
    }

    location /status/ {
        try_files $uri $uri/ /status/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
